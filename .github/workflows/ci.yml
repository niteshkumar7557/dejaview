name: CI

# Installs the project and runs the tests on every PR and on main.
# Never needs secrets: tests replay recorded LLM responses (LLM_MODE=replay).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Install, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dejaview
          POSTGRES_PASSWORD: dejaview
          POSTGRES_DB: dejaview_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dejaview"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway credentials for the CI-only database container; not a secret.
      DATABASE_URL: postgres://dejaview:dejaview@localhost:5432/dejaview_test
      LLM_MODE: replay

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Apply database migrations
        run: npm run migrate --if-present

      - name: Test
        run: npm test
